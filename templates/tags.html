<meta property="og:type" content="{{ og_type|default:'website' }}" />
<meta property="og:url" content="{{ object.get_meta_url }}" />
<meta property="og:title" content="{{ object.get_meta_title }}" />
{% if object.get_meta_description %}<meta property="og:description" content="{{ object.get_meta_description }}" />
{% endif %}<meta property="og:site_name" content="{{ site_name }}" />
<meta property="og:locale" content="es_BO" />
{% if meta_image %}<meta property="og:image" content="{{ meta_image }}" />
{% if meta_image_width %}<meta property="og:image:width" content="{{ meta_image_width }}" />
{% endif %}{% if meta_image_height %}<meta property="og:image:height" content="{{ meta_image_height }}" />
{% endif %}{% endif %}
<meta name="twitter:card" content="{{ twitter_card_type }}" />
<meta name="twitter:title" content="{{ object.get_meta_title }}" />
{% if object.get_meta_description %}<meta name="twitter:description" content="{{ object.get_meta_description }}" />
{% endif %}{% if meta_image %}<meta name="twitter:image" content="{{ meta_image }}" />
{% endif %}
