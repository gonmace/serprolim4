<style>
    @keyframes dropIn {
        0% {
            opacity: 0;
            transform: translateY(-500px);
        }
        80% {
             transform: translateY(10px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .whatsapp-anim {
        opacity: 0;
        animation: dropIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 3s forwards;
    }
</style>

    <div class="absolute right-full bottom-2 mr-3 px-3 py-2 bg-white text-gray-800 text-sm font-medium rounded-lg shadow-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
        {{ site_settings.mjeGlobo }}
        <!-- Triangle pointer -->
        <div class="absolute top-1/2 -right-1 w-2 h-2 bg-white transform -translate-y-1/2 rotate-45"></div>
