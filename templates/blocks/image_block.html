{% load wagtailimages_tags %}
<figure class="flex flex-col items-center my-8">
    {% image value.image format-webp class="max-w-2xl w-full rounded-xl shadow-md" %}
    {% if value.caption or value.attribution %}
    <figcaption class="mt-3 text-sm text-base-content/50 text-center italic">
        {{ value.caption }}
        {% if value.attribution %}<cite>{{ value.attribution }}</cite>{% endif %}
    </figcaption>
    {% endif %}
</figure>
